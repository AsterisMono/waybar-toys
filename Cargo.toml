[package]
name = "wayherdr"
version = "0.1.0"
edition = "2024"
description = "Waybar plugin that shows the statuses of agents in a running herdr server"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
